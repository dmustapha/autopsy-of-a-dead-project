[pytest]
# Collect both the standing suite (test_*.py) and debug-phase hardening tests
# (debug-p{phase}-*.py). Without this, CI's bare `pytest -q` silently skips the
# debug-* files — a vacuous guarantee. The grounding-register hardening test
# (tests/debug-p5-grounding-registers.py) MUST run in CI.
python_files = test_*.py debug-*.py
testpaths = tests
