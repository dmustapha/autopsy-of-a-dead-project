name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Build the same .venv scripts/verify.sh expects, so CI runs the release gate
      # BYTE-IDENTICAL to local dev (EX-11): one command, same gate, no drift.
      - run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
      # The declared one-command release gate (offline tier: no TABPFN_TOKEN / no Ollama,
      # so classify() uses the labeled-rules fallback and narrate() the templated fallback;
      # the 4 suites are deterministic + credential-free. Live-network proof happens at deploy).
      - run: bash scripts/verify.sh
