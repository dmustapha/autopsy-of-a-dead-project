# /etc/nginx/sites-available/autopsy  (symlink into sites-enabled, then: nginx -t && systemctl reload nginx)
# TLS: run `certbot --nginx -d <host>` after this is live on port 80, or use Caddy for auto-TLS.
server {
  listen 80;
  server_name _;   # replace with the Oracle VM host / public IP / domain

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
